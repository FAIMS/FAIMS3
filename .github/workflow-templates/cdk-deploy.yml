# acknowledging extended from OSS https://github.com/FAIMS/FAIMS3
#
# CDK Deploy Workflow for FAIMS3
#
# This workflow deploys FAIMS3 infrastructure to AWS using CDK.
# It supports multiple GitHub environments (dev/prod/stage) with manual triggers.
#
# Shared config-targeting settings (same names as mobile CI):
#   - secrets.GIT_AUTHORIZATION: token with read access to the config repository
#   - vars.CONFIG_REPO_SLUG: config repository slug (owner/repo)
#   - vars.CONFIG_ENVIRONMENT: required config-repo folder name
#   - vars.CONFIG_BRANCH: config repo branch (optional, defaults to 'main')
#   - vars.CONFIG_REPO_PATH: base path within the config repo (optional,
#     defaults to 'configs'; env folder = core.json + aws.json)
#
# CDK-only:
#   - vars.DEPLOY_GA_ROLE_ARN: AWS IAM role ARN for GitHub Actions OIDC
#
# Methodology:
#   1. Checkout main code and external config repository
#   2. Run config setup action to extract AWS account/region and the env
#      folder path (read in place via CDK CONFIG_DIR; nothing is copied)
#   3. Authenticate with AWS using OIDC (no long-lived credentials)
#   4. Install dependencies, build @faims3/build-config, then run CDK
#      diff or deploy based on user input

name: CDK Deploy FAIMS3 to AWS
on:
  # Manually run deploy
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to perform'
        required: true
        default: 'diff'
        type: choice
        options:
          - deploy
          - diff
      environment:
        description: 'Which GitHub environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
          - stage
permissions:
  id-token: write
  contents: read
jobs:
  cdk-deploy:
    # This means the workflow can only run from the selected environments branches
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Display Workflow Inputs
        run: |
          echo "========================================="
          echo "CDK Deploy Workflow Started"
          echo "========================================="
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch/Ref: ${{ github.ref }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "========================================="

      - name: Checkout main code
        uses: actions/checkout@v7

      - name: Display Repository Info
        run: |
          echo "Main repository cloned"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Working directory contents:"
          ls -la

      - name: Require CONFIG_ENVIRONMENT
        run: |
          if [[ -z "${{ vars.CONFIG_ENVIRONMENT }}" ]]; then
            echo "CONFIG_ENVIRONMENT must be set on GitHub Environment '${{ github.event.inputs.environment }}' to the config-repo folder name." >&2
            exit 1
          fi

      - name: Checkout config code
        uses: actions/checkout@v7
        with:
          # e.g. org/repo-name
          repository: ${{ vars.CONFIG_REPO_SLUG }}
          # The OAuth token providing access
          token: ${{ secrets.GIT_AUTHORIZATION }}
          # Branch of the config repo to deploy from
          ref: ${{ vars.CONFIG_BRANCH || 'main' }}
          # Where to clone the repo to
          path: ./config-repo

      - name: Display Config Repository Info
        run: |
          echo "Config repository checked out"
          echo "Config repo slug: ${{ vars.CONFIG_REPO_SLUG }}"
          echo "Config directory contents:"
          ls -la ./config-repo/ || echo "Config directory not found"

      - name: Display CDK Configuration Variables
        run: |
          echo "========================================="
          echo "CDK Configuration Variables"
          echo "========================================="
          echo "GitHub environment: ${{ github.event.inputs.environment }}"
          echo "Config folder: ${{ vars.CONFIG_ENVIRONMENT }}"
          echo "Config branch: ${{ vars.CONFIG_BRANCH || 'main' }}"
          echo "Config repo slug: ${{ vars.CONFIG_REPO_SLUG }}"
          echo "Deploy GA Role ARN: ${{ vars.DEPLOY_GA_ROLE_ARN }}"
          echo "========================================="

      - name: Run FAIMS Config Setup Action
        uses: ./.github/actions/config
        id: faims-config-setup
        with:
          environment: ${{ vars.CONFIG_ENVIRONMENT }}
          config-repo-path: config-repo
          config-base-path: ${{ vars.CONFIG_REPO_PATH || 'configs' }}

      - name: Require aws.json
        if: ${{ steps.faims-config-setup.outputs.has-aws-config != 'true' }}
        run: |
          echo "CDK deploy requires aws.json in ${{ steps.faims-config-setup.outputs.config-dir }}." >&2
          exit 1

      - name: Restore CDK context cache (tracked artifact, if present)
        run: |
          # cdk.context.json pins non-deterministic synth resolutions
          # (AMIs/AZs/subnets). It is a tracked build artifact kept per env
          # in the config repo; CDK reads it from the app directory. CI is
          # pull-only: refresh it from a developer machine via
          # scripts/sync-deployment-config.sh push.
          CONTEXT_FILE="${{ steps.faims-config-setup.outputs.config-dir }}/cdk.context.json"
          if [ -f "$CONTEXT_FILE" ]; then
            cp "$CONTEXT_FILE" infrastructure/aws-cdk/cdk.context.json
            echo "Restored cdk.context.json from the config repo"
          else
            echo "No tracked cdk.context.json for this environment; CDK will resolve live"
          fi

      - name: Display AWS Target Details
        run: |
          echo "========================================="
          echo "AWS Deployment Target"
          echo "========================================="
          echo "AWS Region: ${{ steps.faims-config-setup.outputs.aws-region }}"
          echo "AWS Account: ${{ steps.faims-config-setup.outputs.aws-account }}"
          echo "Role to Assume: ${{ vars.DEPLOY_GA_ROLE_ARN }}"
          echo "========================================="

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ vars.DEPLOY_GA_ROLE_ARN }}
          aws-region: ${{ steps.faims-config-setup.outputs.aws-region }}

      - name: Verify AWS Configuration
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "Current AWS region: $(aws configure get region)"

      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1

      - name: Display AWS CLI Version
        run: |
          echo "AWS CLI installed:"
          aws --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Display Node.js and pnpm Versions
        run: |
          echo "Node.js and pnpm setup complete:"
          echo "Node version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared config library
        run: pnpm --filter=@faims3/build-config run build

      - name: Display Final Configuration Before CDK
        working-directory: infrastructure/aws-cdk
        run: |
          echo "========================================="
          echo "Final Configuration Summary"
          echo "========================================="
          echo "Action to perform: ${{ github.event.inputs.action }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Config dir: ${{ steps.faims-config-setup.outputs.config-dir }} (core.json + aws.json)"
          echo "AWS Region: ${{ steps.faims-config-setup.outputs.aws-region }}"
          echo "AWS Account: ${{ steps.faims-config-setup.outputs.aws-account }}"
          echo "Working directory: $(pwd)"
          echo "Contents:"
          ls -la
          echo "========================================="

      - name: Run CDK Command
        working-directory: infrastructure/aws-cdk
        run: |
          export CONFIG_DIR=${{ steps.faims-config-setup.outputs.config-dir }}
          echo "CONFIG_DIR set to: $CONFIG_DIR"

          if [ "${{ github.event.inputs.action }}" = "deploy" ]; then
            echo "Starting CDK deployment..."
            echo "Command: npx cdk deploy --require-approval never"
            npx cdk deploy --require-approval never
            echo "CDK deployment completed successfully"
          else
            echo "Running CDK diff..."
            echo "Command: npx cdk diff"
            npx cdk diff
            echo "CDK diff completed successfully"
          fi
