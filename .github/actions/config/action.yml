name: 'FAIMS Config'
description: 'Resolve a FAIMS deployment config env folder (core.json + aws.json) in an already checked-out config repository and output AWS details + the folder path for CDK CONFIG_DIR. Requires an already cloned config repo!'
inputs:
  environment:
    description: 'The deployment environment (e.g., dev, staging, production)'
    required: true
  config-repo-path:
    description: 'Path to the cloned config repository relative to the GitHub workspace'
    required: true
  config-base-path:
    description: 'Base path within the config repository where env folders live'
    required: false
    default: 'configs'
outputs:
  aws-region:
    description: 'AWS region from the config'
    value: ${{ steps.parse-config.outputs.aws-region }}
  aws-account:
    description: 'AWS account ID from the config'
    value: ${{ steps.parse-config.outputs.aws-account }}
  config-dir:
    description: 'Absolute path of the env folder (core.json + aws.json); pass to CDK as CONFIG_DIR'
    value: ${{ steps.parse-config.outputs.config-dir }}
runs:
  using: 'composite'
  steps:
    - name: Parse config and set outputs
      id: parse-config
      shell: bash
      run: |
        # One config layout everywhere: <base>/<env>/core.json (shared,
        # non-secret) + aws.json (AWS extension). Region/account live at
        # the top level of aws.json. No secret values are read here -
        # aws.json carries Secrets Manager ARNs only. The folder is read
        # in place (CDK CONFIG_DIR); nothing is copied anywhere.
        ENV_DIR="${{ github.workspace }}/${{ inputs.config-repo-path }}/${{ inputs.config-base-path }}/${{ inputs.environment }}"
        CORE_FILE="$ENV_DIR/core.json"
        AWS_FILE="$ENV_DIR/aws.json"
        if [ ! -f "$AWS_FILE" ] || [ ! -f "$CORE_FILE" ]; then
          echo "Error: Config files not found at $CORE_FILE / $AWS_FILE"
          exit 1
        fi
        AWS_REGION=$(jq -r '.region' "$AWS_FILE")
        AWS_ACCOUNT=$(jq -r '.account' "$AWS_FILE")
        echo "aws-region=${AWS_REGION}" >> $GITHUB_OUTPUT
        echo "aws-account=${AWS_ACCOUNT}" >> $GITHUB_OUTPUT
        echo "config-dir=${ENV_DIR}" >> $GITHUB_OUTPUT
        echo "AWS Region: $AWS_REGION"
        echo "Config dir: $ENV_DIR"
