name: Deploy to Apple App Store on Demo Track, Manual

on:
  workflow_dispatch:
  schedule:
    - cron: '39 20 * * 1-5'

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: print latest_commit
        run: echo ${{ github.sha }}
      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list --after="24 hours"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  ios-deploy:
    name: Deploying to Testflight
    runs-on: macOS-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install jq
        run: |
          brew update
          brew install jq
      - name: Install sops
        run: brew install sops
      - name: Declare some variables
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "app_version=$(jq -r '.version' app/package.json)" >> "$GITHUB_ENV"
      - name: Create version string
        shell: bash
        run: |
          echo "version_string=v${{env.app_version}}-ios-#${{env.sha_short}}" >> "$GITHUB_ENV"

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.1
          bundler-cache: true
          working-directory: app/ios/App
      - run: |
          cd app/ios/App
          bundle install
          bundle exec fastlane install_plugins
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Checkout deployment config repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.APP_CONFIG_REPO_SLUG }}
          token: ${{ secrets.GIT_AUTHORIZATION }}
          ref: ${{ vars.MOBILE_CONFIG_BRANCH || 'main' }}
          path: config_repo
      - name: Generate build environment from deployment config
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          CONFIG_ENV="${{ vars.MOBILE_CONFIG_ENVIRONMENT }}"
          BASE_CONFIG="config_repo/mobile/${CONFIG_ENV}/build-config.json"
          SECRETS_CONFIG="config_repo/mobile/${CONFIG_ENV}/build-secrets.enc.json"

          if [[ ! -f "$BASE_CONFIG" ]]; then
            echo "Missing base config: $BASE_CONFIG" >&2
            exit 1
          fi

          if [[ -f "$SECRETS_CONFIG" ]]; then
            jq -s '.[0] * .[1]' "$BASE_CONFIG" <(sops --decrypt "$SECRETS_CONFIG") \
              | pnpm generate-build-config --config - --platform ios >> "$GITHUB_ENV"
          else
            pnpm generate-build-config --config "$BASE_CONFIG" --platform ios >> "$GITHUB_ENV"
          fi
      - name: Use Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Building webapp
        run: |
          export platform="github-actions-ios"
          export serverprefix="fieldmark"

          pnpm install --frozen-lockfile
          pnpm --filter=@faims3/app run configIOSbuild 
          pnpm run build
      - name: Update IOS Build
        run: |
          cd app
          npx cap update ios
          npx cap sync --deployment ios
          cd ios/App; pod install
      - name: Set up XCode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2
      - name: Deploy iOS Beta to TestFlight via Fastlane
        uses: maierj/fastlane-action@v2.3.0
        with:
          lane: closed_beta_testflight
          subdirectory: 'app/ios/App'
          bundle-install-path: '$HOME/vendor/bundle'
          verbose: false
        env:
          VITE_APP_STORE_CONNECT_TEAM_ID: '${{ env.VITE_APP_STORE_CONNECT_TEAM_ID }}'
          DEVELOPER_APP_ID: '${{ env.DEVELOPER_APP_ID }}'
          VITE_APPLE_BUNDLE_IDENTIFIER: '${{ env.VITE_APPLE_BUNDLE_IDENTIFIER }}'
          DEVELOPER_PORTAL_TEAM_ID: '${{ env.DEVELOPER_PORTAL_TEAM_ID }}'
          FASTLANE_APPLE_ID: '${{ env.FASTLANE_APPLE_ID }}'
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: '${{ env.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}'
          MATCH_PASSWORD: '${{ env.MATCH_PASSWORD }}'
          MATCH_GIT_URL: 'https://github.com/${{ vars.APP_CONFIG_REPO_SLUG }}.git'
          GIT_AUTHORIZATION: '${{ secrets.GIT_AUTHORIZATION }}'
          PROVISIONING_PROFILE_SPECIFIER: '${{ env.PROVISIONING_PROFILE_SPECIFIER }}'
          APPLE_KEY_ID: '${{ env.APPLE_KEY_ID }}'
          APPLE_ISSUER_ID: '${{ env.APPLE_ISSUER_ID }}'
          APPLE_KEY_CONTENT: '${{ env.APPLE_KEY_CONTENT }}'
          BROWSERSTACK_USERNAME: '${{ env.BROWSERSTACK_USERNAME }}'
          BROWSERSTACK_ACCESS_KEY: '${{ env.BROWSERSTACK_ACCESS_KEY }}'
