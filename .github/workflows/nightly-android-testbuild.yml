name: Nightly Android builds

on:
  workflow_dispatch:

  schedule:
    - cron: '39 20 * * 1-5'

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: print latest_commit
        run: echo ${{ github.sha }}
      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list --after="24 hours"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  node-deb-gh-build-play:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Install sops
        run: |
          sudo apt-get update
          sudo apt-get install -y sops

      - name: Declare some variables
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "app_version=$(jq -r '.version' app/package.json)" >> "$GITHUB_ENV"
      - name: Create version string
        shell: bash
        run: |
          echo "version_string=v${{env.app_version}}-android-#${{env.sha_short}}" >> "$GITHUB_ENV"
      # https://docs.github.com/en/free-pro-team@latest/actions/guides/building-and-testing-java-with-gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Checkout deployment config repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.APP_CONFIG_REPO_SLUG }}
          token: ${{ secrets.GIT_AUTHORIZATION }}
          ref: ${{ vars.MOBILE_CONFIG_BRANCH || 'main' }}
          path: config_repo
      - name: Generate build environment from deployment config
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          CONFIG_ENV="${{ vars.MOBILE_CONFIG_ENVIRONMENT }}"
          BASE_CONFIG="config_repo/mobile/${CONFIG_ENV}/build-config.json"
          SECRETS_CONFIG="config_repo/mobile/${CONFIG_ENV}/build-secrets.enc.json"

          if [[ ! -f "$BASE_CONFIG" ]]; then
            echo "Missing base config: $BASE_CONFIG" >&2
            exit 1
          fi

          if [[ -f "$SECRETS_CONFIG" ]]; then
            jq -s '.[0] * .[1]' "$BASE_CONFIG" <(sops --decrypt "$SECRETS_CONFIG") \
              | pnpm generate-build-config --config - --platform android >> "$GITHUB_ENV"
          else
            pnpm generate-build-config --config "$BASE_CONFIG" --platform android >> "$GITHUB_ENV"
          fi
      # https://docs.github.com/en/free-pro-team@latest/actions/guides/building-and-testing-java-with-gradle
      - name: Set up adopt JDK 1.21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
      # https://www.runway.team/blog/ci-cd-pipeline-android-app-fastlane-github-actions
      # Because fastlane stuff is in android, we need working-directory
      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.1
          bundler-cache: true
          working-directory: app/android
      - name: Decode Service Account Key JSON File
        uses: timheuer/base64-to-file@v1
        id: service_account_json_file
        with:
          fileName: 'fastlane-android-google-play-key.json'
          encodedString: ${{ env.GPLAY_SERVICE_ACCOUNT_KEY_JSON }}
      - name: Decode Keystore File
        uses: timheuer/base64-to-file@v1
        id: android_keystore
        with:
          fileName: 'android-signing-keystore.jks'
          encodedString: ${{ env.KEYSTORE_FILE }}
      # https://github.com/android-actions/setup-android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Building webapp
        run: |
          export platform="github-actions-play"

          pnpm install --frozen-lockfile
          pnpm run build
      # https://capacitorjs.com/docs/android
      # The bundle install shouldn't be necessary, but given we've got ios and android in...
      - run: pnpm --filter=@faims3/app run app-update android
      # capacitor.config.json is generated during app prebuild (runconfig) from dist + env.
      - run: pnpm --filter=@faims3/app run webapp-sync -- --deployment android
      - name: Fastlane
        run: |
          cd app/android
          bundle install
          bundle exec fastlane deploy_fieldmark
        env:
          APP_ID: ${{ env.APP_ID }}
          ANDROID_RELEASE_STATUS: ${{ env.ANDROID_RELEASE_STATUS }}
          ANDROID_DEPLOY_TRACK: 'internal'
          JAVA_KEYSTORE: ${{ steps.android_keystore.outputs.filePath }}
          JAVA_KEYSTORE_PASSWORD: ${{ env.JAVA_KEYSTORE_PASSWORD }}
          JAVA_KEY: ${{ env.JAVA_KEY }}
          JAVA_KEY_PASSWORD: ${{ env.JAVA_KEY_PASSWORD }}
          ANDROID_JSON_KEY_FILE: ${{ steps.service_account_json_file.outputs.filePath }}
          VERSION_NAME: ${{ env.version_string }}
