name: Deploy to Apple App Store Production (Individual API Key), Manual

# Uses an Individual App Store Connect API key and readonly fastlane match.
# Certs/profiles must already exist in the Match git repo; this workflow will
# not create or renew them. Set secrets APPLE_INDIVIDUAL_KEY_ID and
# APPLE_INDIVIDUAL_KEY_CONTENT (no Issuer ID). Team-key secrets are unused here.

on:
  workflow_dispatch:

jobs:
  ios-deploy:
    name: Deploying to Production (Individual Key)
    uses: ./.github/workflows/common-ios-build.yml
    with:
      config_environment: production
      fastlane_lane: production_individual
      fastlane_step_name: Deploy iOS app to production with Fastlane (individual key, readonly match)
      enable_bugsnag_sourcemaps: true
    secrets: inherit
