name: Publish Conductor API Container to GHCR
on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name from repository
        id: image-name
        shell: bash
        # use the repo name, converted to lowercase, and append "-api" to the end of it
        # as the image name. For example, if the repo is "FAIMS3",
        # the image name will be "faims3-api".
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_name="${repo_name,,}"
          echo "image_name=${GITHUB_REPOSITORY_OWNER}/${repo_name}-api" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE_NAME=@faims3/api
            NODE_RUN_DIR=api/build/src
          cache-from: |
            type=gha,scope=faims3-api-${{ github.ref_name }}
            type=gha,scope=faims3-api-main
          cache-to: type=gha,mode=max,scope=faims3-api-${{ github.ref_name }}
