name: Build Container Images

on:
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
      couchdb: ${{ steps.filter.outputs.couchdb }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - '!api/couchdb/**'
              - 'library/data-model/**'
              - 'Dockerfile'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/build-images.yml'
            app:
              - 'app/**'
              - 'library/data-model/**'
              - 'library/forms/**'
              - 'Dockerfile'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/build-images.yml'
            web:
              - 'web/**'
              - 'library/data-model/**'
              - 'library/forms/**'
              - 'Dockerfile'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/build-images.yml'
            couchdb:
              - 'api/couchdb/**'
              - '.github/workflows/build-images.yml'

  build-and-push:
    name: Build ${{ matrix.image.name }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - id: api
            name: faims3-api
            context: .
            file: Dockerfile
            target: api
          - id: app
            name: faims3-app
            context: .
            file: Dockerfile
            target: app
          - id: web
            name: faims3-web
            context: .
            file: Dockerfile
            target: web
          - id: couchdb
            name: faims3-couchdb
            context: api/couchdb
            file: api/couchdb/Dockerfile
            target: ''

    steps:
      - name: Check if build needed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.changes.outputs[matrix.image.id] }}" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Changes detected or manual trigger. Building ${{ matrix.image.name }}..."
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No changes detected for ${{ matrix.image.name }}. Skipping build."
          fi

      - name: Checkout code
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: steps.check.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.image.name }}-${{ github.ref_name }}
            type=gha,scope=${{ matrix.image.name }}-main
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ github.ref_name }}
