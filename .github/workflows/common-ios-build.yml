# Shared config-targeting settings live on the selected GitHub Environment:
#   - secrets.GIT_AUTHORIZATION, secrets.SOPS_AGE_KEY
#   - vars.CONFIG_REPO_SLUG, vars.CONFIG_REPO_PATH, vars.CONFIG_BRANCH
#   - vars.CONFIG_ENVIRONMENT (required; config-repo folder name)
# Optional mobile: vars.FASTLANE_REPO_SLUG

name: Reusable iOS Mobile Build

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that supplies config vars and secrets.
        required: true
        type: string
      fastlane_lane:
        description: Fastlane lane used for deployment.
        required: true
        type: string
      fastlane_step_name:
        description: Display name for the Fastlane deployment step.
        required: false
        type: string
        default: Deploy iOS app with Fastlane
      enable_bugsnag_sourcemaps:
        description: Upload Bugsnag sourcemaps after building the web app.
        required: false
        type: boolean
        default: false

jobs:
  ios-deploy:
    environment: ${{ inputs.environment }}
    runs-on: macOS-latest
    continue-on-error: false
    steps:
      # note not using Turbo build as it caused a problem with missing assets
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache pnpm store
        uses: actions/cache@v4
        env:
          cache-name: cache-pnpm-store
        with:
          path: ~/.pnpm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install jq
        run: |
          brew update
          brew install jq

      - name: Install sops
        run: brew install sops

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.1
          bundler-cache: true
          working-directory: app/ios/App

      - run: |
          cd app/ios/App
          bundle install
          bundle exec fastlane install_plugins

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # generate-build-env runs `pnpm generate-build-config` (tsx). Install
      # workspace deps before that, not in the later webapp build step.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require CONFIG_ENVIRONMENT
        run: |
          if [[ -z "${{ vars.CONFIG_ENVIRONMENT }}" ]]; then
            echo "CONFIG_ENVIRONMENT must be set on GitHub Environment '${{ inputs.environment }}' to the config-repo folder name." >&2
            exit 1
          fi

      - name: Checkout deployment config repository
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CONFIG_REPO_SLUG }}
          token: ${{ secrets.GIT_AUTHORIZATION }}
          ref: ${{ vars.CONFIG_BRANCH || 'main' }}
          path: config-repo

      - name: Generate build environment from deployment config
        uses: ./.github/actions/generate-build-env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        with:
          environment: ${{ vars.CONFIG_ENVIRONMENT }}
          config-base-path: ${{ vars.CONFIG_REPO_PATH || 'configs' }}

      - name: Use Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Building webapp
        run: |
          export platform="github-actions-ios"
          export serverprefix="fieldmark"

          pnpm --filter=@faims3/app run configIOSbuild
          pnpm run build

      - name: Upload Bugsnag sourcemaps
        if: ${{ inputs.enable_bugsnag_sourcemaps }}
        run: |
          cd app
          ./bin/bugsnag-sourcemaps.sh IOS

      - name: Update IOS Build
        run: |
          cd app
          npx cap update ios
          npx cap sync --deployment ios
          cd ios/App; pod install

      - name: Set up XCode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      - name: ${{ inputs.fastlane_step_name }}
        uses: maierj/fastlane-action@v2.3.0
        with:
          lane: ${{ inputs.fastlane_lane }}
          subdirectory: 'app/ios/App'
          bundle-install-path: '$HOME/vendor/bundle'
          verbose: false
        env:
          VITE_APP_STORE_CONNECT_TEAM_ID: '${{ env.VITE_APP_STORE_CONNECT_TEAM_ID }}'
          VITE_APPLE_BUNDLE_IDENTIFIER: '${{ env.VITE_APPLE_BUNDLE_IDENTIFIER }}'
          FASTLANE_APPLE_ID: '${{ env.FASTLANE_APPLE_ID }}'
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: '${{ env.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}'
          MATCH_PASSWORD: '${{ env.MATCH_PASSWORD }}'
          # The fastlane/Match repo. Defaults to the config repo when
          # FASTLANE_REPO_SLUG is unset (same-repo behavior).
          MATCH_GIT_URL: 'https://github.com/${{ vars.FASTLANE_REPO_SLUG || vars.CONFIG_REPO_SLUG }}.git'
          GIT_AUTHORIZATION: '${{ secrets.GIT_AUTHORIZATION }}'
          PROVISIONING_PROFILE_SPECIFIER: '${{ env.PROVISIONING_PROFILE_SPECIFIER }}'
          APPLE_KEY_ID: '${{ env.APPLE_KEY_ID }}'
          APPLE_ISSUER_ID: '${{ env.APPLE_ISSUER_ID }}'
          APPLE_KEY_CONTENT: '${{ env.APPLE_KEY_CONTENT }}'
