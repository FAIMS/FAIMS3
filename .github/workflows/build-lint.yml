name: Build & Lint

on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Configure Turborepo Remote Cache
        run: |
          mkdir -p .turbo
          if [ -n "${{ vars.TURBO_API_URL }}" ]; then
            echo '{"apiurl": "${{ vars.TURBO_API_URL }}"}' > .turbo/config.json
            echo "Turborepo config file created at .turbo/config.json"
          else
            echo "TURBO_API_URL not set. Skipping Turborepo cache configuration."
          fi
          if [ -n "$TURBO_TEAM" ] && [ -n "$TURBO_TOKEN" ]; then
            echo "TURBO_TEAM and TURBO_TOKEN environment variables set"
          else
            echo "TURBO_TEAM and/or TURBO_TOKEN not set. Remote caching may not be available."
          fi

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: API Unit tests
        run: |
          cd api
          cp .env.dist .env
          ./keymanagement/makeInstanceKeys.sh
          cd ../app
          cp .env.dist .env
          cd ../
          npx turbo run test --filter=@faims3/api --filter=@faims3/data-model --filter=@faims3/app --filter=@faims3/forms --filter=@faims3/infra-aws-cdk

  # Live Couch + couch-auth-proxy ACL proof (guest isolation, VDU, dbacl).
  # Fails hard if the proxy image/compose pin is unreachable (no skip in CI).
  couch-auth-proxy:
    name: Couch auth-proxy ACL
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI: true
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare env files
        run: |
          set -euo pipefail
          cp ./.env.dist ./.env
          cp ./api/.env.dist ./api/.env
          cp ./app/.env.dist ./app/.env
          # Pin URLs for the ACL suite (Conductor internal vs app sync proxy).
          sed -i 's|^COUCHDB_INTERNAL_URL=.*|COUCHDB_INTERNAL_URL=http://localhost:5984|' api/.env
          sed -i 's|^COUCHDB_PUBLIC_URL=.*|COUCHDB_PUBLIC_URL=http://localhost:5985|' api/.env
          # .env.dist ships a placeholder; CouchDB local.ini needs a real secret.
          COOKIE_SECRET="$(uuidgen | tr -d '-')"
          sed -i "s|^FAIMS_COOKIE_SECRET=.*|FAIMS_COOKIE_SECRET=${COOKIE_SECRET}|" api/.env
          # Generates api/couchdb/local.ini (gitignored) required by the CouchDB Dockerfile.
          pnpm run generate-local-keys

      - name: Build shared libraries
        run: npx turbo run build --filter=@faims3/data-model --filter=@faims3/forms

      - name: Start CouchDB + couch-auth-proxy
        run: |
          set -euo pipefail
          docker compose up -d --build couchdb couch-auth-proxy
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5984/_up >/dev/null \
              && curl -sf http://localhost:5985/_couch-auth-proxy/health >/dev/null; then
              echo "CouchDB + couch-auth-proxy ready"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready"
          docker compose logs couchdb couch-auth-proxy || true
          exit 1

      - name: Run couch-auth-proxy integration tests
        env:
          CI: true
          COUCHDB_INTERNAL_URL: http://localhost:5984
          COUCHDB_PUBLIC_URL: http://localhost:5985
        run: |
          set -euo pipefail
          pnpm --filter=@faims3/api run test:couch-auth-proxy

      - name: Dump proxy logs on failure
        if: failure()
        run: docker compose logs couchdb couch-auth-proxy || true
