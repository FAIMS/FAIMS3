services:
  api:
    env_file:
      - ./api/.env
    environment:
      # Override this so that the API refers to the internal DNS name
      - COUCHDB_INTERNAL_URL=http://couchdb:5984
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - '0.0.0.0:${CONDUCTOR_EXTERNAL_PORT}:${CONDUCTOR_INTERNAL_PORT}'
    volumes:
      - ./library/data-model:/usr/src/library/data-model
      - ./api/src:/usr/src/api/src
      - ./api/views:/usr/src/api/views
      - ./api/keys:/usr/src/api/keys
      - ./api/public:/usr/src/api/public
      - ./api/test:/usr/src/api/test
      - ./api/.env:/usr/src/api/.env
      # Exclude node_modules from being overwritten by host mount
      - /usr/src/node_modules
      - /usr/src/api/node_modules
      - /usr/src/.pnpm
    command: pnpm run watch-api
    depends_on:
      - couchdb
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:${CONDUCTOR_INTERNAL_PORT}/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  web:
    env_file:
      - ./web/.env
    build:
      target: web
    ports:
      - '0.0.0.0:3001:3001'
    volumes:
      - ./library/data-model:/usr/src/library/data-model
      - ./library/forms:/usr/src/library/forms
      - ./web/src:/usr/src/web/src
      - ./web/.env:/usr/src/web/.env
    command: pnpm run web-dev

  app:
    env_file:
      - ./app/.env
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - '3000:3000'
    volumes:
      - ./library/data-model:/usr/src/library/data-model
      - ./library/forms:/usr/src/library/forms
      - ./app/assets:/usr/src/app/assets
      - ./app/public:/usr/src/app/public
      - ./app/.env:/usr/src/app/.env
      - ./app/src:/usr/src/app/src
      # Exclude node_modules from being overwritten by host mount
      - /usr/src/node_modules
      - /usr/src/app/node_modules
      - /usr/src/.pnpm
    command: pnpm run start-app -- --force
    depends_on:
      - api

  couchdb:
    env_file:
      - ./api/.env
    build:
      context: api/couchdb
      dockerfile: Dockerfile
    volumes:
      - type: volume
        source: couchdb_data
        target: /opt/couchdb/data
    ports:
      # Direct Couch for Conductor admin / local debugging. App sync should use
      # couch-auth-proxy (COUCHDB_PUBLIC_URL), not this port.
      - '0.0.0.0:${COUCHDB_EXTERNAL_PORT}:5984'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5984/_up']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Per-document ACL reverse proxy for Pouch↔Couch sync (guest my/all reads).
  # Pin must match vendored `_design/acl` map/VDU in @faims3/data-model (2.3.0).
  couch-auth-proxy:
    # Upstream release v1.2.1 (ddoc 2.3.0); GHCR publishes sha-* tags.
    image: ghcr.io/peterbaker0/couch-auth-proxy:sha-3004091
    environment:
      COUCH_URL: http://couchdb:5984
      # Must match Couch admin (api/.env COUCHDB_USER / COUCHDB_PASSWORD).
      # Compose interpolates from the project `.env` / shell; defaults match
      # api/.env.dist for local-dev.
      COUCH_ADMIN_USER: ${COUCHDB_USER:-admin}
      COUCH_ADMIN_PASSWORD: ${COUCHDB_PASSWORD:-aSecretPasswordThatCantBeGuessed}
      ACL_DB_INCLUDE: '/^data-/'
      ACL_ROUTE_INCLUDE: pouch-sync,session
      # FAIMS provisions `_design/acl` via initDataDB / DATA migration
      ACL_AUTO_INSTALL: 'false'
      AUTH_RESOLVE_VIA_COUCH_SESSION: 'true'
      CORS_ORIGINS: ${COUCH_AUTH_PROXY_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      PORT: '8000'
      HOST: '0.0.0.0'
    ports:
      - '0.0.0.0:${COUCH_AUTH_PROXY_EXTERNAL_PORT:-5985}:8000'
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          'http://127.0.0.1:8000/_couch-auth-proxy/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  couchdb_data:
